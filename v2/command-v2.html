<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Command | NavRakhshak</title><link rel="stylesheet" href="styles.css?v=3"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="logo.svg" alt="NavRakhshak"><div><strong>NAVRAKHSHAK</strong><small>CONTROL HUB</small></div></a><nav class="nav"><a href="dashboard.html">▰ <span>Dashboard</span></a><a href="tracking.html">⌁ <span>Live Tracking</span></a><a href="fleet.html">⚓ <span>Fleet</span></a><a href="rescue.html">⚠ <span>Rescue</span></a><a href="weather.html">☁ <span>Weather</span></a><a class="active" href="command-v2.html">◈ <span>Command</span></a></nav></aside><div class="sidebar-overlay"></div><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="true">×</button><main class="main"><header class="topbar"><div><h2>Command Console</h2><p>Geofence, alert and vessel control</p></div><div class="status">● AUTHORIZED CHANNEL</div></header><section class="page-card card"><div class="metric-label">GEOFENCE CONFIGURATION</div><div class="form"><div class="field"><label>Latitude</label><input id="lat" type="number" step="any" placeholder="23.13161"></div><div class="field"><label>Longitude</label><input id="lon" type="number" step="any" placeholder="88.54735"></div><div class="field"><label>Radius (m)</label><input id="radius" type="number" min="1" value="500"></div><div class="field"><label>Buffer (m)</label><input id="buffer" type="number" min="0" value="50"></div><div class="field"><label>Authorization PIN</label><input id="pin" type="password" maxlength="4" inputmode="numeric" placeholder="4 digit PIN"></div><button class="btn" onclick="saveFence()">◈ Apply Geofence</button><button class="btn danger" onclick="weatherAlert()">Broadcast Weather Alert</button><button class="btn" onclick="muteAll()">Mute All Hardware</button></div><p id="result" class="metric-note">Commands are written to the existing sync channel.</p></section></main></div><script src="app.js?v=3"></script><script>Nav.init().then(()=>Nav.watchPreferences(p=>{if(p.latitude!=null)document.getElementById('lat').value=p.latitude;if(p.longitude!=null)document.getElementById('lon').value=p.longitude;if(p.radius!=null)document.getElementById('radius').value=p.radius;if(p.buffer!=null)document.getElementById('buffer').value=p.buffer}));function auth(){return document.getElementById('pin').value==='1234'}function out(t){document.getElementById('result').textContent=t}function saveFence(){if(!auth())return out('Authentication failed.');const a=+document.getElementById('lat').value,b=+document.getElementById('lon').value,r=+document.getElementById('radius').value,buf=+document.getElementById('buffer').value;if(!Number.isFinite(a)||!Number.isFinite(b)||!r)return out('Enter valid geofence values.');Nav.setPreferences({latitude:a,longitude:b,radius:r,buffer:buf}).then(()=>Nav.cmd(`SET:${a},${b},${r},${buf}`)).then(()=>{document.getElementById('pin').value='';out('GEOFENCE COMMAND DISPATCHED.')})}function weatherAlert(){if(!auth())return out('Authentication failed.');Nav.cmd('WEATHER_ALERT').then(()=>{document.getElementById('pin').value='';out('WEATHER ALERT DISPATCHED.')})}function muteAll(){if(!auth())return out('Authentication failed.');Nav.cmd('MUTE_ALL').then(()=>{document.getElementById('pin').value='';out('MUTE COMMAND DISPATCHED.')})}</script></body></html>
