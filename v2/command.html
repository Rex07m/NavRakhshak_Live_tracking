<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command | NavRakhshak</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="../ChatGPT_Image_Jun_14__2026__09_03_53_PM-removebg-preview.png"><div><strong>NAVRAKHSHAK</strong><small>CONTROL HUB</small></div></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="tracking.html">Live Tracking</a><a href="fleet.html">Fleet</a><a href="rescue.html">Rescue</a><a href="weather.html">Weather</a><a class="active" href="command.html">Command</a></nav></aside><main class="main"><header class="topbar"><div><h2>Command Console</h2><p>Geofence, alert and vessel control</p></div><div class="status">● AUTHORIZED CHANNEL</div></header><section class="page-card card"><div class="metric-label">GEOFENCE CONFIGURATION</div><div class="form"><div class="field"><label>Latitude</label><input id="lat" type="number" step="any" placeholder="23.13161"></div><div class="field"><label>Longitude</label><input id="lon" type="number" step="any" placeholder="88.54735"></div><div class="field"><label>Radius (m)</label><input id="radius" type="number" min="1" value="500"></div><div class="field"><label>Buffer (m)</label><input id="buffer" type="number" min="0" value="50"></div><div class="field"><label>Authorization PIN</label><input id="pin" type="password" maxlength="4" placeholder="4 digit PIN"></div><button class="btn" onclick="saveFence()"><i class="fa-solid fa-satellite-dish"></i> Apply Geofence</button><button class="btn danger" onclick="weatherAlert()">Broadcast Weather Alert</button><button class="btn" onclick="muteAll()">Mute All Hardware</button></div><p id="result" class="metric-note">Commands are written to the existing sync channel.</p></section></main></div><script src="app.js"></script><script>Nav.init().then(()=>Nav.watchPreferences(p=>{if(p.latitude!=null)document.getElementById('lat').value=p.latitude;if(p.longitude!=null)document.getElementById('lon').value=p.longitude;if(p.radius!=null)document.getElementById('radius').value=p.radius;if(p.buffer!=null)document.getElementById('buffer').value=p.buffer}));function auth(){return document.getElementById('pin').value==='1234'}function out(t){document.getElementById('result').textContent=t}function saveFence(){if(!auth())return out('Authentication failed.');const a=+lat.value,b=+lon.value,r=+radius.value,buf=+buffer.value;if(!Number.isFinite(a)||!Number.isFinite(b)||!r)return out('Enter valid geofence values.');Nav.setPreferences({latitude:a,longitude:b,radius:r,buffer:buf}).then(()=>Nav.cmd(`SET:${a},${b},${r},${buf}`)).then(()=>{pin.value='';out('GEOFENCE COMMAND DISPATCHED.')})}function weatherAlert(){if(!auth())return out('Authentication failed.');Nav.cmd('WEATHER_ALERT').then(()=>{pin.value='';out('WEATHER ALERT DISPATCHED.')})}function muteAll(){if(!auth())return out('Authentication failed.');Nav.cmd('MUTE_ALL').then(()=>{pin.value='';out('MUTE COMMAND DISPATCHED.')})}</script></body></html>
