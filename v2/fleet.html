<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fleet | NavRakhshak</title><link rel="stylesheet" href="styles.css?v=3"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="logo.svg" alt="NavRakhshak"><div><strong>NAVRAKHSHAK</strong><small>CONTROL HUB</small></div></a><nav class="nav"><a href="dashboard.html">▰ <span>Dashboard</span></a><a href="tracking.html">⌁ <span>Live Tracking</span></a><a class="active" href="fleet.html">⚓ <span>Fleet</span></a><a href="rescue.html">⚠ <span>Rescue</span></a><a href="weather.html">☁ <span>Weather</span></a><a href="command.html">◈ <span>Command</span></a></nav></aside><div class="sidebar-overlay"></div><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="true">×</button><main class="main"><header class="topbar"><div><h2>Fleet Monitor</h2><p>Vessel node health and live telemetry</p></div><div class="status">● NODE NETWORK</div></header><div class="page-card card"><div class="metric-label">PRIMARY VESSEL NODE</div><div class="metric" id="status">CONNECTING...</div><div class="telemetry"><div class="telemetry-row"><span>Latitude</span><b id="lat">--</b></div><div class="telemetry-row"><span>Longitude</span><b id="lon">--</b></div><div class="telemetry-row"><span>Distance to boundary</span><b id="dist">--</b></div><div class="telemetry-row"><span>Alert state</span><b id="alert">NORMAL</b></div></div></div></main></div><script src="app.js?v=3"></script><script>connectTelemetry(d=>{if(!d)return;document.getElementById('status').textContent=String(d.status||'WAITING').toUpperCase();document.getElementById('lat').textContent=d.latitude??'--';document.getElementById('lon').textContent=d.longitude??'--';document.getElementById('dist').textContent=(+d.distanceToBorder||0).toFixed(1)+' m';document.getElementById('alert').textContent=(d.isAlertActive?'ALERT':'NORMAL')});</script></body></html>
