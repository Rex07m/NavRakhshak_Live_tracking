<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescue | NavRakhshak</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="index.html"><img src="../ChatGPT_Image_Jun_14__2026__09_03_53_PM-removebg-preview.png"><div><strong>NAVRAKHSHAK</strong><small>CONTROL HUB</small></div></a><nav class="nav"><a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a><a href="tracking.html"><i class="fa-solid fa-location-dot"></i><span>Live Tracking</span></a><a href="fleet.html"><i class="fa-solid fa-ship"></i><span>Fleet</span></a><a class="active" href="rescue.html"><i class="fa-solid fa-triangle-exclamation"></i><span>Rescue</span></a><a href="weather.html"><i class="fa-solid fa-cloud-sun"></i><span>Weather</span></a><a href="command.html"><i class="fa-solid fa-compass"></i><span>Command</span></a></nav></aside><main class="main danger-page"><div class="topbar"><div><h2>Rescue Operations</h2><p>Emergency response and SOS acknowledgement</p></div><div class="status" id="rescueStatus">● STANDBY</div></div><section class="panel page-card"><div class="sos"><i class="fa-solid fa-life-ring"></i></div><h2>Emergency Response Console</h2><p id="rescueMessage">Monitoring the live vessel node for distress telemetry.</p><div class="form"><div class="field"><label>Authorization PIN</label><input id="pin" type="password" maxlength="4" placeholder="4 digit PIN"></div><button class="btn danger" onclick="ack()"><i class="fa-solid fa-tower-broadcast"></i> Broadcast Emergency ACK</button><button class="btn" onclick="mute()">Mute Hardware Buzzers</button></div></section></main></div><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script src="app.js"></script><script>Nav.init('rescue');function ack(){if(document.getElementById('pin').value!=='1234')return alert('Invalid Authentication Code.');Nav.cmd('ACK_SOS').then(()=>{document.getElementById('rescueStatus').textContent='● ACK DISPATCHED';document.getElementById('pin').value=''})}function mute(){Nav.cmd('MUTE_ALL').then(()=>alert('MUTE COMMAND DISPATCHED.'))}</script></body></html>
