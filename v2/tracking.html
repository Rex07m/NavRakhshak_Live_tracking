<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Live Tracking | NavRakhshak</title><link rel="stylesheet" href="styles.css?v=3"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="logo.svg" alt="NavRakhshak"><div><strong>NAVRAKHSHAK</strong><small>CONTROL HUB</small></div></a><nav class="nav"><a href="dashboard.html">▰ <span>Dashboard</span></a><a class="active" href="tracking.html">⌁ <span>Live Tracking</span></a><a href="fleet.html">⚓ <span>Fleet</span></a><a href="rescue.html">⚠ <span>Rescue</span></a><a href="weather.html">☁ <span>Weather</span></a><a href="command-v2.html">◈ <span>Command</span></a></nav></aside><div class="sidebar-overlay"></div><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="true">×</button><main class="main"><header class="topbar"><div><h2>Live Tracking</h2><p>Continuous GPS position and safety boundary visualization</p></div><div class="status">● TELEMETRY LIVE</div></header><div class="panel tracking-panel"><div class="panel-head"><strong>VESSEL TRACKING MATRIX</strong><span>GPS / FIREBASE</span></div><div id="map"></div></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js?v=3"></script><script>const map=L.map('map').setView([23.13161,88.54735],15);L.tileLayer('https://api.maptiler.com/maps/hybrid-v4/{z}/{x}/{y}.jpg?key=tbCji5PsF2IBPBis0LYU',{maxZoom:20}).addTo(map);const m=L.circleMarker([23.13161,88.54735],{radius:10,color:'#fff',weight:3,fillColor:'#062d59',fillOpacity:1}).addTo(map),trail=L.polyline([],{color:'#f25a22',weight:4,dashArray:'7 11'}).addTo(map);connectTelemetry(d=>{if(!d)return;const a=+d.latitude,b=+d.longitude;if(isNaN(a)||isNaN(b))return;m.setLatLng([a,b]);trail.addLatLng([a,b]);map.panTo([a,b]);const alarm=String(d.status||'').toUpperCase().includes('SOS')||d.isAlertActive===true;m.setStyle({fillColor:alarm?'#ff0055':'#062d59'});m.bindTooltip('VESSEL NODE<br>'+a.toFixed(6)+', '+b.toFixed(6),{permanent:true,direction:'top'}).openTooltip()});setTimeout(()=>map.invalidateSize(),250);</script></body></html>
